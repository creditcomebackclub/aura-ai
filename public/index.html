<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <script>
    // Capture Supabase's session before cached application code or a WebSocket
    // can try the retired shared token.
    (() => {
      const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      const query = new URLSearchParams(window.location.search);
      const accessToken = hash.get('access_token');
      const refreshToken = hash.get('refresh_token');
      const loginId = query.get('aura_login');
      if (loginId) localStorage.setItem('aura_callback_login_id', loginId);
      if (accessToken) {
        localStorage.setItem('aura_session_token', accessToken);
        if (refreshToken) localStorage.setItem('aura_refresh_token', refreshToken);
        localStorage.removeItem('aura_access_token');
        history.replaceState({}, document.title, window.location.pathname);
      }
    })();
  </script>
  <title>AURA</title>

  <!-- Add to Home Screen support, so this behaves like a standalone app on iPhone -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AURA">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#050505">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <link rel="stylesheet" href="style.css?v=20260807-dg1">
</head>
<body>
  <div id="aurora" aria-hidden="true">
    <span class="aurora-blob aurora-blob--a"></span>
    <span class="aurora-blob aurora-blob--b"></span>
    <span class="aurora-blob aurora-blob--c"></span>
  </div>
  <div id="grid-floor" aria-hidden="true"></div>
  <span class="hud-corner hud-corner--tl" aria-hidden="true"></span>
  <span class="hud-corner hud-corner--tr" aria-hidden="true"></span>
  <span class="hud-corner hud-corner--bl" aria-hidden="true"></span>
  <span class="hud-corner hud-corner--br" aria-hidden="true"></span>
  <h1 id="aura-title">AURA</h1>
  <div
    id="orb-container"
    role="button"
    tabindex="0"
    aria-label="Talk to AURA"
    aria-describedby="status-text"
  >
    <div id="orb" class="idle"></div>
  </div>
  <canvas id="voice-wave" width="640" height="120" aria-hidden="true"></canvas>
  <div id="status-text" role="status" aria-live="polite">Tap to talk to AURA</div>
  <div id="orb-controls">
    <button
      type="button"
      id="conversation-toggle"
      aria-pressed="true"
      title="After AURA finishes speaking, keep listening for your next reply"
    >Conversation on</button>
    <button
      type="button"
      id="volume-toggle"
      data-level="medium"
      title="Playback volume: medium. Tap to cycle."
      aria-label="Playback volume: medium. Tap to change."
    >Volume med</button>
  </div>
  <section id="transcript-panel" aria-hidden="true" aria-label="Conversation transcript">
    <div id="transcript-label">Conversation</div>
    <div id="transcript-content"></div>
  </section>
  <section id="source-panel" aria-hidden="true" aria-label="AURA's last answer and any sources used">
    <div id="source-label">AURA said</div>
    <div id="web-answer"></div>
    <div id="source-links"></div>
  </section>
  
  <script src="/socket.io/socket.io.js"></script>
  <script src="wake_word.js?v=20260807-dg1"></script>
  <script src="app.js?v=20260807-dg1"></script>
</body>
</html>
