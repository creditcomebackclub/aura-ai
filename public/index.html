<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <script>
    // Capture Supabase's session before cached application code or a WebSocket
    // can try the retired shared token.
    (() => {
      const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      const query = new URLSearchParams(window.location.search);
      const accessToken = hash.get('access_token');
      const refreshToken = hash.get('refresh_token');
      const loginId = query.get('aura_login');
      if (loginId) localStorage.setItem('aura_callback_login_id', loginId);
      if (accessToken) {
        localStorage.setItem('aura_session_token', accessToken);
        if (refreshToken) localStorage.setItem('aura_refresh_token', refreshToken);
        localStorage.removeItem('aura_access_token');
        history.replaceState({}, document.title, window.location.pathname);
      }
    })();
  </script>
  <title>AURA</title>

  <!-- Add to Home Screen support, so this behaves like a standalone app on iPhone -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AURA">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#050505">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 id="aura-title">AURA</h1>
  <div id="orb-container">
    <div id="orb" class="idle"></div>
  </div>
  <div id="status-text">Tap to talk to AURA</div>
  
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js?v=20260729-auth4"></script>
</body>
</html>
