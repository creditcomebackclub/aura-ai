services:
  - type: web
    name: aura-brain
    runtime: docker
    plan: starter
    branch: codex/aura-cloud-brain
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: AURA_RUNTIME
        value: cloud
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: AURA_OWNER_ID
        sync: false
      - key: AURA_STATE_BACKEND
        value: supabase
      - key: AURA_AUTH_MODE
        value: supabase
      - key: AURA_BIND_HOST
        value: 0.0.0.0
      - key: AURA_TIMEZONE
        value: America/Phoenix
      - key: AURA_SCHEDULER_ENABLED
        value: "true"
      - key: AURA_COMPANION_DEVICE
        value: chriss-macbook-pro
      - key: BLACKBOARD_ICAL_URL
        sync: false
