services:
  - type: web
    name: aura-brain
    runtime: docker
    plan: starter
    branch: main
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: AURA_RUNTIME
        value: cloud
      - key: AI_PROVIDER
        value: xai
      - key: AURA_CHAT_MODEL
        value: grok-4.5
      - key: AURA_MEMORY_MODEL
        value: gpt-5.6-luna
      - key: AURA_ROUTER_MODEL
        value: gpt-5.6-luna
      - key: AURA_MEMORY_CONTEXT_CACHE_MS
        value: "15000"
      - key: AURA_TRANSCRIBE_MODEL
        value: gpt-4o-mini-transcribe
      - key: AURA_STT_PROVIDER
        value: deepgram
      - key: AURA_DEEPGRAM_MODEL
        value: nova-3
      - key: AURA_DEEPGRAM_ENDPOINTING_MS
        value: "400"
      - key: AURA_DEEPGRAM_UTTERANCE_END_MS
        value: "1800"
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: AURA_REASONING_EFFORT
        value: low
      - key: AURA_AGENT_REGISTRY_TIMEOUT_MS
        value: "500"
      - key: AURA_SLOW_TURN_MS
        value: "15000"
      - key: AURA_TIMING_TRACE
        value: "true"
      - key: AURA_SUMMARY_MESSAGE_THRESHOLD
        value: "40"
      - key: AURA_LEARNING_REVIEW
        value: "true"
      - key: AURA_LEARNING_TURN_INTERVAL
        value: "10"
      - key: AURA_LEARNING_TOOL_ITER_INTERVAL
        value: "10"
      - key: XAI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_WEB_SEARCH_MODEL
        value: gpt-5.4-mini
      - key: CARTESIA_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: AURA_OWNER_ID
        sync: false
      - key: AURA_STATE_BACKEND
        value: supabase
      - key: AURA_AUTH_MODE
        value: hybrid
      - key: AURA_ACCESS_TOKEN
        sync: false
      - key: AURA_BIND_HOST
        value: 0.0.0.0
      - key: AURA_TIMEZONE
        value: America/Phoenix
      - key: AURA_WEB_SEARCH_CONTEXT
        value: medium
      - key: AURA_WEB_SEARCH_TIMEOUT_MS
        value: "45000"
      - key: AURA_WEB_SEARCH_DAILY_LIMIT
        value: "60"
      - key: AURA_SCHEDULER_ENABLED
        value: "true"
      - key: AURA_EXECUTIVE_LOOP
        value: "true"
      - key: AURA_EXECUTIVE_QUIET_START
        value: "21"
      - key: AURA_EXECUTIVE_QUIET_END
        value: "7"
      - key: AURA_MEETING_BRIEF_MIN_MINUTES
        value: "8"
      - key: AURA_MEETING_BRIEF_MAX_MINUTES
        value: "20"
      - key: AURA_CRON_SECRET
        sync: false
      - key: AURA_COMPANION_DEVICE
        value: chriss-macbook-pro
      - key: BLACKBOARD_ICAL_URL
        sync: false
      - key: CALENDAR_ICAL_URL
        sync: false
      - key: GOOGLE_CALENDAR_CLIENT_ID
        sync: false
      - key: GOOGLE_CALENDAR_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALENDAR_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: AURA_OWNER_EMAIL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
